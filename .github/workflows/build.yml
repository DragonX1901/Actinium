name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      # Only the checks that need no GPU and no display. The Vulkan section of
      # smokeTest creates a window and a device, which no hosted runner has; it
      # stays a local check.
      - name: Headless checks
        run: ./gradlew smokeTest --no-daemon -Pactinium.headless=true

      - uses: actions/upload-artifact@v4
        with:
          name: actinium-jar
          path: build/libs/*.jar
          if-no-files-found: error
