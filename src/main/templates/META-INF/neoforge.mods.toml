modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# The Window mixin has to apply before Minecraft creates its OpenGL context, so this config
# must be declared here rather than discovered later.
[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# Required in fact, not just in spirit. Actinium configures and patches a Vulkan backend; it
# does not provide one. Without VulkanMod the settings screen has nothing to bind to and every
# compatibility mixin is skipped, so declaring this optional would ship a mod that silently
# does nothing.
[[dependencies."${mod_id}"]]
modId = "vulkanmod"
type = "required"
reason = "Actinium configures and patches VulkanMod's renderer; it does not replace it."
versionRange = "[0.5,)"
ordering = "AFTER"
side = "CLIENT"

# Shader pack mods drive the whole pipeline through OpenGL and expect a real context. They are
# incompatible with a Vulkan backend regardless of Actinium, so the declaration belongs on
# VulkanMod rather than here.
