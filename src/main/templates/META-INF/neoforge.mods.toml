modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "logo.png"
credits = "Vulkan renderer ported from VulkanMod 0.6.8 by xCollateral (LGPL-3.0)"

# The Window mixin has to apply before Minecraft creates its OpenGL context, so this config
# must be declared here rather than discovered later.
[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "vulkanmod.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "vulkanmod"
type = "incompatible"
reason = "Actinium already includes the VulkanMod renderer. Remove the separate VulkanMod jar."
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "iris"
type = "incompatible"
reason = "Iris renders through OpenGL; Actinium renders through Vulkan."
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "sodium"
type = "incompatible"
reason = "Sodium replaces the chunk renderer that Actinium's Vulkan renderer also replaces."
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "embeddium"
type = "incompatible"
reason = "Embeddium replaces the chunk renderer that Actinium's Vulkan renderer also replaces."
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
