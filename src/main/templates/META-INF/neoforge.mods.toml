modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "logo.png"
credits = "Vulkan rendering by VulkanModNeoForge (yiyuyan), ported from VulkanMod by xCollateral"

# The Window mixin has to apply before Minecraft creates its OpenGL context, so this config
# must be declared here rather than discovered later.
[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# Optional, because Actinium runs two ways. In compatibility mode it configures and patches
# VulkanMod's renderer, and without VulkanMod present every compatibility mixin is skipped and
# the settings screen has nothing to bind to. In renderer mode (-Dactinium.renderer=true) it
# creates the Vulkan device itself and VulkanMod must not be installed at all: two mods cannot
# both own the window surface.
[[dependencies."${mod_id}"]]
modId = "vulkanmod"
type = "optional"
reason = "Compatibility mode patches VulkanMod's renderer. Renderer mode replaces it."
versionRange = "[0.5,)"
ordering = "AFTER"
side = "CLIENT"

# Shader pack mods drive the whole pipeline through OpenGL and expect a real context. They are
# incompatible with a Vulkan backend regardless of Actinium, so the declaration belongs on
# VulkanMod rather than here.
