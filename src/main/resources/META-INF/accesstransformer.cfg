# Actinium access transformers.
#
# Nothing here opens a vanilla member. Every field the mixins need is reachable through
# @Shadow, which is scoped to one mixin rather than opened to every mod on the classpath.
#
# What is here repairs a collision between two other transformers.
#
# An access transformer widening a vanilla method breaks any @Overwrite of that method that
# declares itself private. Mixin checks visibility against the target as it stands at apply
# time, and refuses:
#
#   PRIVATE @Overwrite method renderEntity in vulkanmod.mixins.json:render.entity.LevelRendererM
#   cannot reduce visibiliy of PUBLIC target method
#
# Mod loading then aborts. Simulated, which ships inside sable and so inside Create:
# Aeronautics, widens LevelRenderer.renderEntity:
#
#   public-f net.minecraft.client.renderer.LevelRenderer renderEntity(...)V
#
# Neither side is wrong. Widening a private method is what access transformers are for, and
# declaring an overwrite private matches the vanilla method it replaces.
#
# Widening the overwrite is the direction that costs nothing. An @Overwrite replaces the
# target's body, so raising it to public produces exactly the public method the other
# transformer asked for. Narrowing the vanilla method instead would leave every caller that
# compiled against the widened version throwing IllegalAccessError.
#
# Format: public <class> <field/method> # comment

public net.vulkanmod.mixin.render.entity.LevelRendererM renderEntity(Lnet/minecraft/world/entity/Entity;DDDFLcom/mojang/blaze3d/vertex/PoseStack;Lnet/minecraft/client/renderer/MultiBufferSource;)V
